baseURL: "https://emmah-3815.github.io/" 
title: Emma Huang
theme: PaperMod

enableInlineShortcodes: true
enableRobotsTXT: true
pagination:
  pagerSize: 20

taxonomies:
    tag: tags

menu:
    main:
        - name: experience
          url: experience/
          weight: 1 
        - name: about
          url: about/
          weight: 2

params:
    description: "This website hosts Emma Huang's research papers, curriculum vitae, resume and contact information."
    author: Emma Huang
    DateFormat: "January 2006"
    defaultTheme: light
    hideFooter: false
    disableThemeToggle: true
    ShowShareButtons: false
    ShowReadingTime: false
    disableSpecial1stPost: true
    disableAnchoredHeadings: true
    ShowPostNavLinks: false
    ShowBreadCrumbs: false
    ShowCodeCopyButtons: true
    ShowAllPagesInArchive: false
    MainSections: ["experience","about"]
    ShowToc: false
    disableScrollToTop: true
    TocOpen: true
    ShowWordCount: false
    UseHugoToc: true
    comments: false
    math: true
    profileMode:
          enabled: true
          title: Emma Huang
          subtitle: "I am a fourth year student at the University of California, San Diego studying Electrical Engineering with a specialization in Machine Learning and Controls. My research interests include medical robotics and autonomous surgical systems."
          imageUrl: "leonarudo_waving.png"
          imageWidth: 160
          imageHeight: 160
          buttons:
            - name: experience
              url: experience/
            - name: about
              url: about/

    socialIcons:
        - name: CV
          url: cv.pdf
        - name: Email
          url: mailto:emmaymhuang@gmail.com
        - name: Google Scholar
          url: https://scholar.google.com/citations?user=fSDXsqEAAAAJ&hl=en&oi=ao
        - name: LinkedIn
          url: https://www.linkedin.com/in/emmahuang3815/
        - name: GitHub
          url: https://github.com/emmah-3815

    assets:
        disableScrollBarStyle: true
    cover:
        hiddenInList: false
        hiddenInSingle: true
    label:
      text: "Emma Huang"
      icon: favicon.ico
      iconHeight: 18

markup:
    goldmark:
        renderer:
            unsafe: true
    highlight:
        guessSyntax: true
        style: autumn 
    tableOfContents:
        endLevel: 2
        ordered: false
        startLevel: 2
